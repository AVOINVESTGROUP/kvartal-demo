kind: "AppStack"
schemaVersion: "v1"
runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
  - variable: PORT
    value: "8080"
  - variable: PARTNER_API_BASE_URL
    value: "https://kvartal-office-api-544286782827.europe-west4.run.app"
  - variable: PLATFORM_API_BASE_URL
    value: "https://kvartal-platform-api-544286782827.europe-west4.run.app"
  - variable: PARTNER_ORGANIZATION_SLUG
    value: "kvartal-moscow"
  - variable: PUBLIC_SITE_BASE_URL
    value: "https://kvartal-web-dev--kvartal-dev.europe-west4.hosted.app"
  - variable: KVARTAL_ADMIN_BASIC_AUTH
    secret: kvartal-admin-basic-auth
    availability:
      - RUNTIME
  - variable: KVARTAL_ADMIN_SESSION_TOKEN
    secret: kvartal-admin-session-token
    availability:
      - RUNTIME
