kind: "AppStack"
schemaVersion: "v1"
runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
  - variable: PORT
    value: "8080"
  - variable: PUBLIC_API_BASE_URL
    value: "https://kvartal-office-api-qslxzoismq-ez.a.run.app"
  - variable: PARTNER_SITE_DEFAULT_TENANT
    value: "apart4u"
